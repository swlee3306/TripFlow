<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>환율 계산기 - TripFlow</title>
    <meta name="description" content="실시간 환율 정보와 환율 계산기">
    
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><path fill='%23059669' d='M16 2L4 8v16l12 6 12-6V8L16 2z'/><path fill='%23ffffff' d='M12 14h8v4h-8z'/></svg>">
    
    <!-- Tailwind CSS -->
    <link href="./css/output.css" rel="stylesheet">
    
    <!-- Chart.js for exchange rate charts -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-gray-50 min-h-screen">
    <!-- Header -->
    <header class="bg-white shadow-sm border-b">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center py-4">
                <div class="flex items-center">
                    <svg class="h-8 w-8 text-blue-600 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path>
                    </svg>
                    <h1 class="text-2xl font-bold text-gray-900">TripFlow</h1>
                </div>
                <nav class="flex items-center space-x-4">
                    <a href="/" class="text-gray-600 hover:text-gray-900 px-3 py-2 rounded-md text-sm font-medium">홈</a>
                    <a href="/exchange.html" class="bg-blue-600 text-white px-3 py-2 rounded-md text-sm font-medium">환율 계산기</a>
                    <a href="/worldtime.html" class="text-gray-600 hover:text-gray-900 px-3 py-2 rounded-md text-sm font-medium">세계 시간</a>
                    <a href="/expense.html" class="text-gray-600 hover:text-gray-900 px-3 py-2 rounded-md text-sm font-medium">여행 가계부</a>
                </nav>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto py-8 px-4 sm:px-6 lg:px-8">
        <!-- Page Title -->
        <div class="mb-8">
            <h2 class="text-3xl font-bold text-gray-900 mb-2">실시간 환율 계산기</h2>
            <p class="text-gray-600">최신 환율 정보로 여행 예산을 계산해보세요</p>
        </div>

        <!-- Exchange Rate Calculator -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
            <!-- Calculator Section -->
            <div class="bg-white rounded-lg shadow p-6">
                <h3 class="text-xl font-semibold text-gray-900 mb-6">환율 계산기</h3>
                
                <!-- Currency Selection -->
                <div class="grid grid-cols-2 gap-4 mb-6">
                    <div>
                        <label for="from-currency" class="block text-sm font-medium text-gray-700 mb-2">변환할 통화</label>
                        <select id="from-currency" class="block w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                            <option value="KRW">🇰🇷 한국 원 (KRW)</option>
                            <option value="USD">🇺🇸 미국 달러 (USD)</option>
                            <option value="EUR">🇪🇺 유로 (EUR)</option>
                            <option value="JPY">🇯🇵 일본 엔 (JPY)</option>
                            <option value="GBP">🇬🇧 영국 파운드 (GBP)</option>
                            <option value="CNY">🇨🇳 중국 위안 (CNY)</option>
                            <option value="AUD">🇦🇺 호주 달러 (AUD)</option>
                            <option value="CAD">🇨🇦 캐나다 달러 (CAD)</option>
                        </select>
                    </div>
                    <div>
                        <label for="to-currency" class="block text-sm font-medium text-gray-700 mb-2">변환될 통화</label>
                        <select id="to-currency" class="block w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                            <option value="USD">🇺🇸 미국 달러 (USD)</option>
                            <option value="KRW">🇰🇷 한국 원 (KRW)</option>
                            <option value="EUR">🇪🇺 유로 (EUR)</option>
                            <option value="JPY">🇯🇵 일본 엔 (JPY)</option>
                            <option value="GBP">🇬🇧 영국 파운드 (GBP)</option>
                            <option value="CNY">🇨🇳 중국 위안 (CNY)</option>
                            <option value="AUD">🇦🇺 호주 달러 (AUD)</option>
                            <option value="CAD">🇨🇦 캐나다 달러 (CAD)</option>
                        </select>
                    </div>
                </div>

                <!-- Amount Input -->
                <div class="mb-6">
                    <label for="amount" class="block text-sm font-medium text-gray-700 mb-2">금액</label>
                    <div class="relative">
                        <input type="number" id="amount" placeholder="0" 
                               class="block w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                               min="0" step="0.01">
                        <div class="absolute inset-y-0 right-0 pr-3 flex items-center">
                            <span id="from-currency-symbol" class="text-gray-500 text-sm">₩</span>
                        </div>
                    </div>
                </div>

                <!-- Calculate Button -->
                <button id="calculate-btn" class="w-full bg-blue-600 text-white py-2 px-4 rounded-md hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 transition-colors">
                    환율 계산하기
                </button>

                <!-- Result Display -->
                <div id="result-section" class="mt-6 p-4 bg-gray-50 rounded-md hidden">
                    <div class="text-center">
                        <div class="text-2xl font-bold text-gray-900 mb-2">
                            <span id="result-amount">0</span>
                            <span id="to-currency-symbol" class="text-lg">$</span>
                        </div>
                        <div class="text-sm text-gray-600">
                            <span id="from-amount">0</span> <span id="from-currency-code">KRW</span> = 
                            <span id="result-amount-full">0</span> <span id="to-currency-code">USD</span>
                        </div>
                        <div class="text-xs text-gray-500 mt-2">
                            환율: 1 <span id="from-currency-code-2">KRW</span> = <span id="exchange-rate">0</span> <span id="to-currency-code-2">USD</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Exchange Rate Info Section -->
            <div class="bg-white rounded-lg shadow p-6">
                <h3 class="text-xl font-semibold text-gray-900 mb-6">실시간 환율 정보</h3>
                
                <!-- Loading State -->
                <div id="loading-rates" class="text-center py-8">
                    <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-blue-600 mx-auto"></div>
                    <p class="text-gray-600 mt-2">환율 정보를 불러오는 중...</p>
                </div>

                <!-- Exchange Rates List -->
                <div id="rates-list" class="hidden">
                    <div class="space-y-3">
                        <!-- Rates will be populated here -->
                    </div>
                    <div class="mt-4 text-xs text-gray-500 text-center">
                        <p>마지막 업데이트: <span id="last-updated"></span></p>
                        <button id="refresh-rates" class="text-blue-600 hover:text-blue-800 underline">새로고침</button>
                    </div>
                </div>

                <!-- Error State -->
                <div id="error-rates" class="hidden text-center py-8">
                    <div class="text-red-500 mb-2">
                        <svg class="h-8 w-8 mx-auto" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                        </svg>
                    </div>
                    <p class="text-gray-600">환율 정보를 불러올 수 없습니다.</p>
                    <button id="retry-rates" class="mt-2 text-blue-600 hover:text-blue-800 underline">다시 시도</button>
                </div>
            </div>
        </div>

        <!-- Exchange Rate Chart -->
        <div class="mt-8 bg-white rounded-lg shadow p-6">
            <h3 class="text-xl font-semibold text-gray-900 mb-6">환율 추이 차트</h3>
            <div class="h-64">
                <canvas id="exchange-chart"></canvas>
            </div>
        </div>

        <!-- Popular Currency Pairs -->
        <div class="mt-8 bg-white rounded-lg shadow p-6">
            <h3 class="text-xl font-semibold text-gray-900 mb-6">주요 환율</h3>
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                <div class="border rounded-lg p-4 hover:bg-gray-50 cursor-pointer" data-pair="USD-KRW">
                    <div class="flex justify-between items-center">
                        <div>
                            <div class="font-medium">USD/KRW</div>
                            <div class="text-sm text-gray-600">미국 달러 / 한국 원</div>
                        </div>
                        <div class="text-right">
                            <div class="font-bold" id="usd-krw-rate">-</div>
                            <div class="text-sm text-gray-500" id="usd-krw-change">-</div>
                        </div>
                    </div>
                </div>
                <div class="border rounded-lg p-4 hover:bg-gray-50 cursor-pointer" data-pair="EUR-KRW">
                    <div class="flex justify-between items-center">
                        <div>
                            <div class="font-medium">EUR/KRW</div>
                            <div class="text-sm text-gray-600">유로 / 한국 원</div>
                        </div>
                        <div class="text-right">
                            <div class="font-bold" id="eur-krw-rate">-</div>
                            <div class="text-sm text-gray-500" id="eur-krw-change">-</div>
                        </div>
                    </div>
                </div>
                <div class="border rounded-lg p-4 hover:bg-gray-50 cursor-pointer" data-pair="JPY-KRW">
                    <div class="flex justify-between items-center">
                        <div>
                            <div class="font-medium">JPY/KRW</div>
                            <div class="text-sm text-gray-600">일본 엔 / 한국 원</div>
                        </div>
                        <div class="text-right">
                            <div class="font-bold" id="jpy-krw-rate">-</div>
                            <div class="text-sm text-gray-500" id="jpy-krw-change">-</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-white border-t mt-16">
        <div class="max-w-7xl mx-auto py-6 px-4 sm:px-6 lg:px-8">
            <div class="text-center text-sm text-gray-500">
                <p>&copy; 2025 TripFlow. 환율 정보는 참고용입니다.</p>
            </div>
        </div>
    </footer>

    <!-- JavaScript -->
    <script src="./js/exchange.js"></script>
</body>
</html>
