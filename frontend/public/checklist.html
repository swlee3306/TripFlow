                    <a href="/expense.html" class="text-gray-600 hover:text-gray-900 px-3 py-2 rounded-md text-sm font-medium">여행 가계부</a>

                    <a href="/expense.html" class="block px-3 py-2 rounded-md text-base font-medium text-gray-600 hover:text-gray-900 hover:bg-gray-100">여행 가계부</a>

    </header>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto py-8 px-4 sm:px-6 lg:px-8">
        <!-- Page Title -->
        <div class="mb-8">
            <h2 class="text-3xl font-bold text-gray-900 mb-2">여행 체크리스트</h2>
            <p class="text-gray-600">여행 준비를 위한 체크리스트를 만들어보세요</p>
        </div>

        <!-- Checklist Setup Form -->
        <div class="bg-white rounded-lg shadow p-6 mb-8">
            <h3 class="text-xl font-semibold text-gray-900 mb-6">체크리스트 설정</h3>
            <form id="checklist-setup-form" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                <div>
                    <label for="checklist-name" class="block text-sm font-medium text-gray-700 mb-2">체크리스트 이름</label>
                    <input type="text" id="checklist-name" placeholder="예: 제주도 3박 4일 여행" 
                           class="block w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500" required>
                </div>
                <div>
                    <label for="trip-type" class="block text-sm font-medium text-gray-700 mb-2">여행 유형</label>
                    <select id="trip-type" class="block w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500" required>
                        <option value="">여행 유형 선택</option>
                        <option value="domestic">🏠 국내 여행</option>
                        <option value="international">✈️ 해외 여행</option>
                        <option value="business">💼 출장</option>
                        <option value="backpacking">🎒 배낭여행</option>
                        <option value="family">👨‍👩‍👧‍👦 가족여행</option>
                        <option value="honeymoon">💕 신혼여행</option>
                        <option value="solo">🚶‍♀️ 솔로여행</option>
                        <option value="group">👥 그룹여행</option>
                        <option value="adventure">🏔️ 모험여행</option>
                        <option value="luxury">💎 럭셔리여행</option>
                    </select>
                </div>
                <div>
                    <label for="trip-duration" class="block text-sm font-medium text-gray-700 mb-2">여행 기간</label>
                    <select id="trip-duration" class="block w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500" required>
                        <option value="">여행 기간 선택</option>
                        <option value="day-trip">당일치기</option>
                        <option value="weekend">주말여행 (2-3일)</option>
                        <option value="short">짧은 여행 (4-7일)</option>
                        <option value="medium">중간 여행 (1-2주)</option>
                        <option value="long">긴 여행 (2주 이상)</option>
                    </select>
                </div>
                <div class="md:col-span-2 lg:col-span-3">
                    <button type="submit" class="bg-blue-600 text-white px-6 py-2 rounded-md hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 transition-colors">
                        <i class="fas fa-plus mr-2"></i>체크리스트 생성하기
                    </button>
                </div>
            </form>
        </div>

        <!-- Checklist Display -->
        <div id="checklist-display" class="hidden">
            <!-- Checklist Header -->
            <div class="bg-white rounded-lg shadow p-6 mb-6">
                <div class="flex justify-between items-center mb-4">
                    <div>
                        <h3 id="checklist-title" class="text-2xl font-bold text-gray-900">체크리스트 제목</h3>
                        <p id="checklist-subtitle" class="text-gray-600">체크리스트 부제목</p>
                    </div>
                    <div class="flex space-x-2">
                        <button id="save-checklist" class="bg-green-600 text-white px-4 py-2 rounded-md hover:bg-green-700 transition-colors">
                            <i class="fas fa-save mr-2"></i>저장
                        </button>
                        <button id="load-checklist" class="bg-blue-600 text-white px-4 py-2 rounded-md hover:bg-blue-700 transition-colors">
                            <i class="fas fa-download mr-2"></i>불러오기
                        </button>
                        <button id="new-checklist" class="bg-gray-600 text-white px-4 py-2 rounded-md hover:bg-gray-700 transition-colors">
                            <i class="fas fa-plus mr-2"></i>새로 만들기
                        </button>
                    </div>
                </div>
                
                <!-- Progress Bar -->
                <div class="mb-4">
                    <div class="flex justify-between text-sm text-gray-600 mb-2">
                        <span>진행률</span>
                        <span id="progress-text">0 / 0 완료</span>
                    </div>
                    <div class="w-full bg-gray-200 rounded-full h-2">
                        <div id="progress-bar" class="bg-blue-600 h-2 rounded-full transition-all duration-300" style="width: 0%"></div>
                    </div>
                </div>
            </div>

            <!-- Checklist Categories -->
            <div id="checklist-categories" class="space-y-6">
                <!-- Categories will be populated here -->
            </div>

            <!-- Add Custom Item -->
            <div class="bg-white rounded-lg shadow p-6 mt-6">
                <h4 class="text-lg font-semibold text-gray-900 mb-4">사용자 정의 항목 추가</h4>
                <div class="flex space-x-4">
                    <input type="text" id="custom-item" placeholder="새로운 체크리스트 항목을 입력하세요" 
                           class="flex-1 px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                    <select id="custom-category" class="px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                        <option value="기타">기타</option>
                    </select>
                    <button id="add-custom-item" class="bg-blue-600 text-white px-4 py-2 rounded-md hover:bg-blue-700 transition-colors">
                        <i class="fas fa-plus mr-2"></i>추가
                    </button>
                </div>
            </div>
        </div>

        <!-- Saved Checklists -->
        <div id="saved-checklists" class="bg-white rounded-lg shadow p-6">
            <h3 class="text-xl font-semibold text-gray-900 mb-6">저장된 체크리스트</h3>
            <div id="saved-list" class="space-y-3">
                <!-- Saved checklists will be populated here -->
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-white border-t mt-16">
        <div class="max-w-7xl mx-auto py-6 px-4 sm:px-6 lg:px-8">
            <div class="text-center text-sm text-gray-500">
                <p>&copy; 2025 TripFlow. 체크리스트는 참고용입니다.</p>
            </div>
        </div>
    </footer>

                            '카메라 및 충전기',
                            '여권 및 신분증',
                            '럭셔리 소품'
                        ],
                        '출발 전': [
                            '집 안전 점검',
                            '특별 서비스 확인',
                            '여행지 정보 확인',
                            '비상 연락처 준비',
                            '럭셔리 경험 계획'
                        ]
                    }
                };
                this.init();
            }

            init() {
                this.setupEventListeners();
                this.loadSavedChecklists();
            }

            setupEventListeners() {
                // Mobile menu toggle
                const mobileMenuButton = document.getElementById('mobile-menu-button');
                const mobileMenu = document.getElementById('mobile-menu');
                
                if (mobileMenuButton && mobileMenu) {
                    mobileMenuButton.addEventListener('click', () => {
                        mobileMenu.classList.toggle('hidden');
                    });
                }

                // Checklist setup form
                const setupForm = document.getElementById('checklist-setup-form');
                if (setupForm) {
                    setupForm.addEventListener('submit', (e) => {
                        e.preventDefault();
                        this.createChecklist();
                    });
                }

                // Save checklist
                const saveButton = document.getElementById('save-checklist');
                if (saveButton) {
                    saveButton.addEventListener('click', () => {
                        this.saveChecklist();
                    });
                }

                // Load checklist
                const loadButton = document.getElementById('load-checklist');
                if (loadButton) {
                    loadButton.addEventListener('click', () => {
                        this.showLoadModal();
                    });
                }

                // New checklist
                const newButton = document.getElementById('new-checklist');
                if (newButton) {
                    newButton.addEventListener('click', () => {
                        this.resetChecklist();
                    });
                }

                // Add custom item
                const addCustomButton = document.getElementById('add-custom-item');
                if (addCustomButton) {
                    addCustomButton.addEventListener('click', () => {
                        this.addCustomItem();
                    });
                }
            }

            createChecklist() {
                const name = document.getElementById('checklist-name').value;
                const type = document.getElementById('trip-type').value;
                const duration = document.getElementById('trip-duration').value;

                if (!name || !type || !duration) {
                    alert('모든 필드를 입력해주세요.');
                    return;
                }

                this.currentChecklist = {
                    name: name,
                    type: type,
                    duration: duration,
                    items: {},
                    completed: {},
                    createdAt: new Date().toISOString()
                };

                this.generateChecklistItems();
                this.displayChecklist();
                this.updateProgress();
            }

            generateChecklistItems() {
                const type = this.currentChecklist.type;
                const baseItems = this.checklistData[type] || this.checklistData.domestic;
                
                // Add duration-specific items
                const durationItems = this.getDurationSpecificItems(this.currentChecklist.duration);
                
                this.currentChecklist.items = {
                    ...baseItems,
                    ...durationItems
                };

                // Initialize completed status
                this.currentChecklist.completed = {};
                Object.keys(this.currentChecklist.items).forEach(category => {
                    this.currentChecklist.completed[category] = {};
                    this.currentChecklist.items[category].forEach(item => {
                        this.currentChecklist.completed[category][item] = false;
                    });
                });
            }

            getDurationSpecificItems(duration) {
                const durationItems = {
                    'day-trip': {
                        '당일 여행': [
                            '간단한 간식',
                            '물병',
                            '휴대폰 충전기',
                            '현금'
                        ]
                    },
                    'weekend': {
                        '주말 여행': [
                            '추가 의류',
                            '여분의 충전기',
                            '간단한 약품'
                        ]
                    },
                    'short': {
                        '짧은 여행': [
                            '여분의 의류',
                            '세탁용품',
                            '여행 가이드북'
                        ]
                    },
                    'medium': {
                        '중간 여행': [
                            '다양한 의류',
                            '세탁용품',
                            '여행 가이드북',
                            '현지 통화',
                            '여행용 어댑터'
                        ]
                    },
                    'long': {
                        '긴 여행': [
                            '다양한 의류',
                            '세탁용품',
                            '여행 가이드북',
                            '현지 통화',
                            '여행용 어댑터',
                            '장기 여행 보험',
                            '의료 기록'
                        ]
                    }
                };

                return durationItems[duration] || {};
            }

            displayChecklist() {
                const display = document.getElementById('checklist-display');
                const title = document.getElementById('checklist-title');
                const subtitle = document.getElementById('checklist-subtitle');
                const categories = document.getElementById('checklist-categories');

                display.classList.remove('hidden');

                title.textContent = this.currentChecklist.name;
                subtitle.textContent = `${this.getTypeName(this.currentChecklist.type)} • ${this.getDurationName(this.currentChecklist.duration)}`;

                categories.innerHTML = '';
                Object.keys(this.currentChecklist.items).forEach(category => {
                    const categoryDiv = document.createElement('div');
                    categoryDiv.className = 'bg-white rounded-lg shadow p-6';
                    categoryDiv.innerHTML = `
                        <h4 class="text-lg font-semibold text-gray-900 mb-4">${category}</h4>
                        <div class="space-y-2">
                            ${this.currentChecklist.items[category].map(item => `
                                <label class="flex items-center space-x-3 cursor-pointer hover:bg-gray-50 p-2 rounded">
                                    <input type="checkbox" 
                                           class="checklist-item h-4 w-4 text-blue-600 focus:ring-blue-500 border-gray-300 rounded"
                                           data-category="${category}" 
                                           data-item="${item}"
                                           ${this.currentChecklist.completed[category][item] ? 'checked' : ''}>
                                    <span class="text-gray-700">${item}</span>
                                </label>
                            `).join('')}
                        </div>
                    `;
                    categories.appendChild(categoryDiv);
                });

                // Add event listeners to checkboxes
                this.setupCheckboxListeners();
            }

            setupCheckboxListeners() {
                const checkboxes = document.querySelectorAll('.checklist-item');
                checkboxes.forEach(checkbox => {
                    checkbox.addEventListener('change', (e) => {
                        const category = e.target.dataset.category;
                        const item = e.target.dataset.item;
                        this.currentChecklist.completed[category][item] = e.target.checked;
                        this.updateProgress();
                    });
                });
            }

            updateProgress() {
                let totalItems = 0;
                let completedItems = 0;

                Object.keys(this.currentChecklist.completed).forEach(category => {
                    Object.keys(this.currentChecklist.completed[category]).forEach(item => {
                        totalItems++;
                        if (this.currentChecklist.completed[category][item]) {
                            completedItems++;
                        }
                    });
                });

                const progressText = document.getElementById('progress-text');
                const progressBar = document.getElementById('progress-bar');
                const percentage = totalItems > 0 ? (completedItems / totalItems) * 100 : 0;

                progressText.textContent = `${completedItems} / ${totalItems} 완료`;
                progressBar.style.width = `${percentage}%`;
            }

            addCustomItem() {
                const customItem = document.getElementById('custom-item').value;
                const customCategory = document.getElementById('custom-category').value;

                if (!customItem.trim()) {
                    alert('항목을 입력해주세요.');
                    return;
                }

                if (!this.currentChecklist.items[customCategory]) {
                    this.currentChecklist.items[customCategory] = [];
                    this.currentChecklist.completed[customCategory] = {};
                }

                this.currentChecklist.items[customCategory].push(customItem);
                this.currentChecklist.completed[customCategory][customItem] = false;

                // Update category dropdown
                this.updateCategoryDropdown();

                // Refresh display
                this.displayChecklist();
                this.updateProgress();

                // Clear input
                document.getElementById('custom-item').value = '';
            }

            updateCategoryDropdown() {
                const categorySelect = document.getElementById('custom-category');
                const currentValue = categorySelect.value;
                
                categorySelect.innerHTML = '<option value="기타">기타</option>';
                Object.keys(this.currentChecklist.items).forEach(category => {
                    if (category !== '기타') {
                        const option = document.createElement('option');
                        option.value = category;
                        option.textContent = category;
                        categorySelect.appendChild(option);
                    }
                });
                categorySelect.value = currentValue;
            }

            async saveChecklist() {
                if (!this.currentChecklist) {
                    alert('저장할 체크리스트가 없습니다.');
                    return;
                }

                try {
                    // API URL 설정 - 로컬 개발 시에만 localhost:8080 사용
                    const isLocalDev = window.location.hostname === 'localhost' || 
                                     window.location.hostname === '127.0.0.1' ||
                                     window.location.hostname === '0.0.0.0';
                    
                    const apiUrl = isLocalDev ? 'http://localhost:8080/api/checklists' : '/api/checklists';
                    
                    const response = await fetch(apiUrl, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(this.currentChecklist)
                    });

                    if (response.ok) {
                        const data = await response.json();
                        console.log('Checklist saved successfully:', data);
                        alert('체크리스트가 저장되었습니다.');
                        // 저장 후 자동으로 목록 새로고침
                        await this.loadSavedChecklists();
                    } else {
                        throw new Error('저장에 실패했습니다.');
                    }
                } catch (error) {
                    console.error('Error saving checklist:', error);
                    alert('저장 중 오류가 발생했습니다.');
                }
            }

            async loadSavedChecklists() {
                try {
                    // API URL 설정 - 로컬 개발 시에만 localhost:8080 사용
                    const isLocalDev = window.location.hostname === 'localhost' || 
                                     window.location.hostname === '127.0.0.1' ||
                                     window.location.hostname === '0.0.0.0';
                    
                    const apiUrl = isLocalDev ? 'http://localhost:8080/api/checklists' : '/api/checklists';
                    
                    const response = await fetch(apiUrl);
                    if (response.ok) {
                        const data = await response.json();
                        console.log('API Response:', data);
                        
                        // Go API 응답 구조: { success: true, data: [...] }
                        // Vercel API 응답 구조: { checklists: [...] }
                        let checklists = [];
                        if (data.data && Array.isArray(data.data)) {
                            checklists = data.data;
                        } else if (data.checklists && Array.isArray(data.checklists)) {
                            checklists = data.checklists;
                        } else if (Array.isArray(data)) {
                            checklists = data;
                        }
                        
                        this.displaySavedChecklists(checklists);
                    }
                } catch (error) {
                    console.error('Error loading checklists:', error);
                }
            }

            displaySavedChecklists(checklists) {
                const savedList = document.getElementById('saved-list');
                
                // checklists가 배열인지 확인
                if (!Array.isArray(checklists) || checklists.length === 0) {
                    savedList.innerHTML = `
                        <div class="text-center py-8">
                            <div class="text-gray-400 mb-4">
                                <svg class="mx-auto h-12 w-12" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v10a2 2 0 002 2h8a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4" />
                                </svg>
                            </div>
                            <h3 class="text-lg font-medium text-gray-900 mb-2">저장된 체크리스트가 없습니다</h3>
                            <p class="text-gray-500 mb-4">새로운 체크리스트를 만들어보세요!</p>
                            <button onclick="document.getElementById('checklist-setup-form').scrollIntoView({ behavior: 'smooth' })" 
                                    class="inline-flex items-center px-4 py-2 border border-transparent text-sm font-medium rounded-md text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500">
                                <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
                                </svg>
                                새 체크리스트 만들기
                            </button>
                        </div>
                    `;
                    return;
                }

                savedList.innerHTML = checklists.map(checklist => `
                    <div class="border rounded-lg p-4 hover:bg-gray-50 cursor-pointer" onclick="travelChecklist.loadChecklist('${checklist.id}')">
                        <div class="flex justify-between items-center">
                            <div>
                                <h4 class="font-medium text-gray-900">${checklist.name}</h4>
                                <p class="text-sm text-gray-600">${this.getTypeName(checklist.type)} • ${this.getDurationName(checklist.duration)}</p>
                                <p class="text-xs text-gray-500">${new Date(checklist.createdAt).toLocaleDateString()}</p>
                            </div>
                            <div class="flex space-x-2">
                                <button onclick="event.stopPropagation(); travelChecklist.deleteChecklist('${checklist.id}')" 
                                        class="text-red-600 hover:text-red-800">
                                    <i class="fas fa-trash"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                `).join('');
            }

            async loadChecklist(id) {
                try {
                    // API URL 설정 - 로컬 개발 시에만 localhost:8080 사용
                    const isLocalDev = window.location.hostname === 'localhost' || 
                                     window.location.hostname === '127.0.0.1' ||
                                     window.location.hostname === '0.0.0.0';
                    
                    const apiUrl = isLocalDev ? `http://localhost:8080/api/checklists/${id}` : `/api/checklists/${id}`;
                    
                    const response = await fetch(apiUrl);
                    if (response.ok) {
                        const data = await response.json();
                        // Go API 응답 구조: { success: true, data: {...} }
                        // Vercel API 응답 구조: 직접 객체 반환
                        const checklist = data.data || data.checklist || data;
                        this.currentChecklist = checklist;
                        this.displayChecklist();
                        this.updateProgress();
                        document.getElementById('checklist-display').scrollIntoView({ behavior: 'smooth' });
                        // 불러온 후 목록도 새로고침
                        await this.loadSavedChecklists();
                    } else {
                        alert('체크리스트를 불러올 수 없습니다.');
                    }
                } catch (error) {
                    console.error('Error loading checklist:', error);
                    alert('체크리스트를 불러오는 중 오류가 발생했습니다.');
                }
            }

            async deleteChecklist(id) {
                if (!confirm('정말로 이 체크리스트를 삭제하시겠습니까?')) {
                    return;
                }

                try {
                    // API URL 설정 - 로컬 개발 시에만 localhost:8080 사용
                    const isLocalDev = window.location.hostname === 'localhost' || 
                                     window.location.hostname === '127.0.0.1' ||
                                     window.location.hostname === '0.0.0.0';
                    
                    const apiUrl = isLocalDev ? `http://localhost:8080/api/checklists/${id}` : `/api/checklists/${id}`;
                    
                    const response = await fetch(apiUrl, {
                        method: 'DELETE'
                    });

                    if (response.ok) {
                        alert('체크리스트가 삭제되었습니다.');
                        // 삭제 후 자동으로 목록 새로고침
                        await this.loadSavedChecklists();
                    } else {
                        throw new Error('삭제에 실패했습니다.');
                    }
                } catch (error) {
                    console.error('Error deleting checklist:', error);
                    alert('삭제 중 오류가 발생했습니다.');
                }
            }

            resetChecklist() {
                document.getElementById('checklist-setup-form').reset();
                document.getElementById('checklist-display').classList.add('hidden');
                this.currentChecklist = null;
            }

            getTypeName(type) {
                const typeNames = {
                    'domestic': '국내 여행',
                    'international': '해외 여행',
                    'business': '출장',
                    'backpacking': '배낭여행',
                    'family': '가족여행',
                    'honeymoon': '신혼여행'
                };
                return typeNames[type] || type;
            }

            getDurationName(duration) {
                const durationNames = {
                    'day-trip': '당일치기',
                    'weekend': '주말여행',
                    'short': '짧은 여행',
                    'medium': '중간 여행',
                    'long': '긴 여행'
                };
                return durationNames[duration] || duration;
            }
        }

        // Initialize the application
        let travelChecklist;
        document.addEventListener('DOMContentLoaded', () => {
            travelChecklist = new TravelChecklist();
        });
    </script>
</body>
</html>
